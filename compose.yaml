services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/app.sqlite
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s

# Docker initializes this volume with the non-root ownership set in the image.
volumes:
  data:
